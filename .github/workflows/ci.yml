name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      # CI runs fully offline: deterministic mock LLM, stubbed web search,
      # SEC served from committed fixtures. No secrets required.
      LLM_PROVIDER: mock
      WEB_SEARCH_PROVIDER: stub
      SEC_EDGAR_MODE: cache
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest)
        run: pytest -q

      - name: Offline eval smoke run (proves the graph + reflection loop run end-to-end)
        run: python evals/run_eval.py --provider mock --name report_ci
